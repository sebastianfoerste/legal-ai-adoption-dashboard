name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Read-only token for every job; no job writes to the repository.
permissions:
  contents: read

# One run per branch: a newer push cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from the "packageManager" field in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Supply-chain gate: no open high or critical advisory in the resolved tree.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Vitest tests
        run: pnpm run test

      - name: Validate telemetry contract
        run: pnpm run telemetry:validate

      - name: Check the private-data boundary
        run: pnpm run boundary:check

      - name: Run feedback-loop tests and output check
        run: make feedback-check

      # The check regenerates the pilot plan and the unified kit; the committed files must match.
      - name: Run workshop-kit check and output check
        run: |
          make workshop-check
          git diff --exit-code -- workshop-kit/examples/generated-pilot-plan.md workshop-kit/enablement/workshop-kit-unified.md workshop-kit/enablement/workshop-kit-unified.html \
            || { echo "STALE: regenerated workshop-kit files differ from the committed ones; run make workshop-check and commit them"; exit 1; }

      # The build must not need network access: no font or asset is fetched at build time.
      - name: Run Next.js build
        run: pnpm run build

  # The Python modules on their declared floor (requires-python >= 3.11); the main job uses 3.12.
  python-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run feedback-loop tests and output check on the floor version
        run: make feedback-check

      - name: Run workshop-kit check on the floor version
        run: make workshop-check

  # Accessibility gate: axe-core (WCAG 2.2 AA plus heading rules) on every HTML route of the
  # built app at 1280 px and 375 px, and distinct page titles. See e2e/a11y.spec.ts.
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm run build

      - name: Run the accessibility gate
        run: pnpm run test:a11y

  # Static analysis of the workflow files themselves (pinned actions, token permissions,
  # credential persistence). Fails on any finding of medium severity or above.
  workflow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZIZMOR_VERSION: "1.31.1"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run zizmor
        run: uvx "zizmor@${ZIZMOR_VERSION}" --min-severity medium .github/workflows product-feedback-loop/.github/workflows
