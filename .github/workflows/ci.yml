name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Vitest tests
        run: pnpm run test

      - name: Validate telemetry contract
        run: pnpm run telemetry:validate

      - name: Check the private-data boundary
        run: pnpm run boundary:check

      - name: Run feedback-loop tests and output check
        run: make feedback-check

      - name: Run workshop-kit check
        run: make workshop-check

      # The build must not need network access: no font or asset is fetched at build time.
      - name: Run Next.js build
        run: pnpm run build
