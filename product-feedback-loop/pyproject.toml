[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "feedback-loop"
version = "0.2.0"
description = "Turn customer interviews into a prioritised, traceable product backlog and a 'what we heard, what we changed' memo."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/sebastianfoerste/legal-ai-adoption-dashboard"
Issues = "https://github.com/sebastianfoerste/legal-ai-adoption-dashboard/issues"

[project.scripts]
feedback-loop = "feedback_loop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
