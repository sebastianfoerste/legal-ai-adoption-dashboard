# GitHub runs only the workflows under the repository root's .github/workflows/. This
# nested file is therefore inactive inside legal-ai-adoption-dashboard and applies only
# if product-feedback-loop is extracted into its own repository. In this repository the
# root workflow covers the module through `make feedback-check`.
name: ci
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: make install
      - run: make test
      - name: Demo reproducibility
        run: |
          make demo
          test -f examples/prioritized-backlog.md
